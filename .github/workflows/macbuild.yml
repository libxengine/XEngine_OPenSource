name: macos build workflows

on:
  push:
    branches:
      - 'master'
  
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
          - os: macos-15-intel
          - os: macos-26-intel
          - os: macos-26
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout main repository code
        uses: actions/checkout@v7
        
      - name: Set TERM variable
        run: echo "TERM=xterm" >> $GITHUB_ENV
          
      - name: Set up Dependency x86_64 Environment 
        if: matrix.os == 'macos-15-intel' || matrix.os == 'macos-26-intel'
        run: |
            latest_tag=$(curl -s -H "Authorization: Bearer ${{ github.token }}" https://api.github.com/repos/libxengine/libxengine/releases/latest | jq -r .tag_name)
            wget https://github.com/libxengine/libxengine/releases/download/$latest_tag/XEngine_Mac_x86-64.zip
            unzip ./XEngine_Mac_x86-64.zip -d ./XEngine_Mac_x86-64
            cd XEngine_Mac_x86-64

            chmod 777 *
            ./XEngine_LINEnv.sh -i 3
      - name: Set up Dependency Arm64 Environment 
        if: matrix.os == 'macos-15' || matrix.os == 'macos-26'
        run: |
            latest_tag=$(git ls-remote --tags --sort="v:refname" https://github.com/libxengine/libxengine.git | awk '{print $2}' | sed 's/refs\/tags\///' | tail -n 1)
            wget https://github.com/libxengine/libxengine/releases/download/$latest_tag/XEngine_Mac_Arm64.zip
            unzip ./XEngine_Mac_Arm64.zip -d ./XEngine_Mac_Arm64
            cd XEngine_Mac_Arm64

            chmod 777 *
            ./XEngine_LINEnv.sh -i 3
      - name: install library package
        run: |
            brew install luajit -y

      - name: make
        run: | 
            cd XEngine_Module
            cd jsoncpp
            make PLATFORM=mac
            cd ..
            cd tinyxml2
            make PLATFORM=mac
            cd ..
            cd XEngine_InfoReport
            make PLATFORM=mac
            cd ..
            cd XEngine_Token
            make PLATFORM=mac
            cd ..
            cd XEngine_MSGNotify
            make PLATFORM=mac
            cd ..
            cd XEngine_AIApi
            make PLATFORM=mac
            cd ..
            cd XEngine_Verification
            make PLATFORM=mac
            cd ..
            cd XEngine_PluginExtension
            make PLATFORM=mac